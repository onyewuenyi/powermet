[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "powermet"
version = "0.9.0"
description = "Power Metrology & Modeling V0: FE <-> BE power correlation, local CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "pyarrow>=10",
    "duckdb>=0.9",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "joblib>=1.2",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]
all = ["matplotlib>=3.6", "psutil>=5.9"]
dev = ["pytest>=7"]

[project.scripts]
powermet = "powermet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
powermet = ["profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
